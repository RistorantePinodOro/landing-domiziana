# Pubblica la landing su GitHub Pages a ogni push su main.
# Prima esecuzione: prova ad attivare Pages da sola (enablement). Se fallisce, attivarlo a mano:
# Settings > Pages > Source: "GitHub Actions", poi rilanciare il workflow da Actions.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepara i file da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

  hostinger:
    # Facoltativo: carica la cartella anche su Hostinger via FTP. Parte solo se nel repository sono impostate
    # la variabile HOSTINGER_FTP_HOST e i secret HOSTINGER_FTP_USER / HOSTINGER_FTP_PASSWORD (vedi README, "SU HOSTINGER").
    if: vars.HOSTINGER_FTP_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Carica su Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.HOSTINGER_FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            README.md
            LICENSE
            config.php
