# Ogni lunedi' mattina (05:23 UTC = 7:23 ora italiana d'estate, 6:23 d'inverno) scarica le recensioni
# della scheda Google (Places API), aggiorna recensioni.json se e' cambiato qualcosa e ripubblica la
# pagina. Si puo' lanciare a mano in qualsiasi momento da Actions > "Aggiorna le recensioni Google".
# Prima di funzionare servono: il secret GOOGLE_PLACES_API_KEY e la variabile GOOGLE_PLACE_ID
# (Settings > Secrets and variables > Actions). Vedi README.md, "Recensioni Google automatiche".
name: Aggiorna le recensioni Google

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    outputs:
      cambiato: ${{ steps.salva.outputs.cambiato }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Scarica le recensioni dalla scheda Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
          GOOGLE_PLACE_QUERY: ${{ vars.GOOGLE_PLACE_QUERY }}
        run: node scripts/aggiorna-recensioni.mjs
      - name: Salva recensioni.json se e' cambiato
        id: salva
        run: |
          if git diff --quiet -- recensioni.json; then
            echo "cambiato=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recensioni.json
          git commit -m "Aggiorna le recensioni Google"
          git push
          echo "cambiato=true" >> "$GITHUB_OUTPUT"

  pubblica:
    needs: aggiorna
    if: needs.aggiorna.outputs.cambiato == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository aggiornato
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Prepara i file da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
