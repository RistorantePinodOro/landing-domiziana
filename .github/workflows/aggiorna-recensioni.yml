# Ogni mattina (05:23 UTC = 7:23 ora italiana d'estate, 6:23 d'inverno) scarica le recensioni della scheda Google
# (Places API) e ripubblica la pagina su GitHub Pages con il file aggiornato. recensioni.json non viene mai salvato nel
# repository. Si può lanciare a mano da Actions > "Aggiorna le recensioni Google".
# Serve il secret GOOGLE_PLACES_API_KEY (Settings > Secrets and variables > Actions); GOOGLE_PLACE_ID è facoltativa
# (senza, vale il Place ID di data/restaurant.json). Su Hostinger le recensioni si rinnovano da sole con recensioni.php.
name: Aggiorna le recensioni Google

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica le recensioni dalla scheda Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: node scripts/aggiorna-recensioni.mjs
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Prepara i file da pubblicare
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
